<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tesla Live TV Wall & 私人影院 (D档行车常亮版)</title>
  <!-- HLS.js 流媒体硬件解码引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg-main: #070a10;
      --bg-panel: rgba(15, 20, 30, 0.92);
      --bg-card: rgba(26, 34, 50, 0.72);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* 整体座舱布局：左侧可收起片单/频道抽屉 + 右侧满屏播放区 */
    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 左侧边栏：频道墙与私人电影库 */
    .sidebar {
      width: 350px;
      height: 100%;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: margin-left 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    body.cinema-pure .sidebar {
      margin-left: -350px;
    }

    .brand-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 12px var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0.9; }
    }

    .clock-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* 顶部一级分类切换 Tab */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-glass);
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-color: #67e8f9;
      color: #fff;
      box-shadow: 0 6px 18px rgba(6, 182, 212, 0.32);
    }

    /* 频道与电影滚动列表区 */
    .media-list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .media-list-wrap::-webkit-scrollbar { width: 4px; }
    .media-list-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    .media-card {
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 13px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.18s;
    }

    .media-card:hover {
      background: rgba(37, 99, 235, 0.22);
      border-color: rgba(96, 165, 250, 0.4);
    }

    .media-card.active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.38), rgba(6, 182, 212, 0.22));
      border-color: #38bdf8;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.22);
    }

    .media-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .media-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .media-info {
      overflow: hidden;
    }

    .media-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      white-space: nowrap;
    }

    .media-badge.vod {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.4);
    }

    /* 侧边栏底部：自定义添加电影/直播源入口 */
    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(10, 14, 22, 0.9);
    }

    .btn-add-movie {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(56, 189, 248, 0.55);
      background: rgba(6, 182, 212, 0.12);
      color: #38bdf8;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add-movie:active { transform: scale(0.98); }

    /* 右侧主舞台：单屏巨幕 + 四宫格直播墙 + 顶部/底部悬浮控制栏 */
    .stage-main {
      flex: 1;
      height: 100%;
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部悬浮控制条 */
    .stage-topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .pill-btn {
      height: 46px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .pill-btn:active { transform: scale(0.95); }

    .pill-btn.active {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-color: #67e8f9;
    }

    .pill-btn.unmute-warn {
      background: linear-gradient(135deg, #dc2626, #ea580c);
      border-color: #fca5a5;
      animation: pulse 1.8s infinite;
    }

    .now-playing-pill {
      padding: 0 18px;
      height: 46px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    /* 单屏巨幕播放器容器 */
    #singleStage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #mainVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #mainIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
    }

    /* 四宫格直播电视墙容器 (2x2 Grid) */
    #gridWallStage {
      width: 100%;
      height: 100%;
      display: none;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      background: #05080f;
    }

    .wall-cell {
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .wall-cell.focused {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .wall-cell video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .wall-cell-label {
      position: absolute;
      bottom: 10px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wall-cell-expand {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(37, 99, 235, 0.88);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 底部实时滚动快讯条 */
    .bottom-ticker {
      position: absolute;
      bottom: 14px;
      left: 16px;
      right: 16px;
      z-index: 60;
      height: 44px;
      background: rgba(12, 17, 28, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    body.hide-ticker .bottom-ticker {
      display: none;
    }

    /* 添加电影 / 自定义源弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 520px;
      max-width: 100%;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .form-field input {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-field input:focus { border-color: #38bdf8; }

    .btn-submit {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- 左侧抽屉：频道列表 & 私人电影院片单 -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-title">
          <div class="live-dot"></div>
          <span>TESLA 直播墙 & 影院</span>
        </div>
        <div class="clock-badge" id="clockText">22:35</div>
      </div>

      <!-- 3大板块切换 -->
      <div class="nav-tabs">
        <button class="tab-btn active" id="tabLive" onclick="switchCategory('live')">
          📺 电视直播
        </button>
        <button class="tab-btn" id="tabMovies" onclick="switchCategory('movies')">
          🎬 私人影院
        </button>
        <button class="tab-btn" id="tabBili" onclick="switchCategory('bili')">
          🅱️ B站/综合
        </button>
      </div>

      <!-- 频道/片单列表容器 -->
      <div class="media-list-wrap" id="mediaListContainer"></div>

      <!-- 底部：随时添加新电影或自定义直播源 -->
      <div class="sidebar-footer">
        <button class="btn-add-movie" onclick="openAddModal()">
          ➕ 添加想看的电影 / 直播源
        </button>
        <div style="font-size:11.5px;color:var(--text-sub);text-align:center;">
          💡 挂 D 档开车时请保持在浏览器内观看，画面常亮不退出
        </div>
      </div>
    </aside>

    <!-- 右侧主播放舞台 -->
    <main class="stage-main">
      <!-- 顶部悬浮控制栏 -->
      <div class="stage-topbar">
        <div class="topbar-group">
          <button class="pill-btn" onclick="togglePureCinema()" id="btnToggleSidebar">
            ◀ 收起列表 (巨幕模式)
          </button>
          <div class="now-playing-pill">
            <span class="live-dot"></span>
            <span id="nowPlayingTitle">广东卫视 (高清实时真直播)</span>
          </div>
        </div>

        <div class="topbar-group">
          <button class="pill-btn unmute-warn" id="btnSound" onclick="toggleMasterSound()">
            🔇 点此开启声音
          </button>
          <button class="pill-btn active" id="btnModeSingle" onclick="setStageMode('single')">
            🖥️ 单屏巨幕
          </button>
          <button class="pill-btn" id="btnModeWall" onclick="setStageMode('wall')">
            🎛️ 四宫格电视墙
          </button>
          <button class="pill-btn" onclick="toggleTicker()">
            📰 快讯条
          </button>
          <button class="pill-btn" onclick="launchTeslaTheaterFullscreen()" title="仅限P档驻车时使用">
            🚀 P档真全屏
          </button>
        </div>
      </div>

      <!-- 模式 1：单屏高清巨幕播放器 -->
      <div id="singleStage">
        <video id="mainVideo" playsinline autoplay muted controls></video>
        <iframe id="mainIframe" allow="autoplay; fullscreen"></iframe>
      </div>

      <!-- 模式 2：四宫格实时电视监控墙 (同时看 4 个国内台) -->
      <div id="gridWallStage">
        <div class="wall-cell focused" onclick="focusWallCell(0)" ondblclick="expandWallCellToSingle(0)">
          <video id="wallVid0" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 1. 广东卫视 (实时)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(0)">🔍 全屏看此台</button>
        </div>
        <div class="wall-cell" onclick="focusWallCell(1)" ondblclick="expandWallCellToSingle(1)">
          <video id="wallVid1" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 2. 河北卫视 (4K实时)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(1)">🔍 全屏看此台</button>
        </div>
        <div class="wall-cell" onclick="focusWallCell(2)" ondblclick="expandWallCellToSingle(2)">
          <video id="wallVid2" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 3. 广州综合频道 (实时)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(2)">🔍 全屏看此台</button>
        </div>
        <div class="wall-cell" onclick="focusWallCell(3)" ondblclick="expandWallCellToSingle(3)">
          <video id="wallVid3" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 4. 兰州新闻综合 (HD)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(3)">🔍 全屏看此台</button>
        </div>
      </div>

      <!-- 底部电视台同款实时新闻滚动条 -->
      <div class="bottom-ticker">
        <div style="display:flex;align-items:center;gap:10px;overflow:hidden;">
          <span style="background:#ef4444;color:#fff;font-size:11px;font-weight:900;padding:3px 8px;border-radius:6px;white-space:nowrap;">实时快讯</span>
          <span id="tickerText" style="font-size:13.5px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            欢迎使用特斯拉车载直播墙与私人影院 · 挂入 D 档行驶时画面保持常亮不退出 · 点击左上角「收起列表」可享 100% 纯享巨幕。
          </span>
        </div>
        <span style="font-size:12px;color:#38bdf8;white-space:nowrap;cursor:pointer;font-weight:700;" onclick="nextTicker()">下一条 ▸</span>
      </div>
    </main>
  </div>

  <!-- 弹窗：添加想看的电影 / 剧集 / 直播源 -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:19px;font-weight:900;">➕ 添加电影 / 剧集 / 直播源</span>
        <button class="pill-btn" style="height:34px;padding:0 12px;" onclick="closeAddModal()">✕</button>
      </div>
      <div style="font-size:13px;color:var(--text-sub);line-height:1.5;">
        支持添加任意 <code>.mp4</code> 电影直链、<code>.m3u8</code> 影视切片源、或 B站 <code>BV号 / 直播间房号</code>，添加后自动保存在您的私人影院片单中：
      </div>
      <div class="form-field">
        <label>🎬 影片 / 频道名称</label>
        <input type="text" id="newMediaTitle" placeholder="例如：《星际穿越》4K / 狂飙 第1集 / 凤凰卫视" />
      </div>
      <div class="form-field">
        <label>🔗 视频流地址 (.mp4 / .m3u8 / B站BV号 / 直播房号)</label>
        <input type="text" id="newMediaUrl" placeholder="粘贴 https://...mp4 或 .m3u8 链接，或输入 BV1xx411c7mD" />
      </div>
      <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="btn-submit" style="flex:1;" onclick="saveCustomMedia('movies')">💾 存入【私人影院】并立即播放</button>
        <button class="btn-submit" style="background:rgba(255,255,255,0.12);font-size:13px;" onclick="saveCustomMedia('live')">存入【直播】</button>
      </div>
    </div>
  </div>

  <script>
    /********************************************************************
     * 1. 内置节目单配置区（后期想加任何电影，直接往 MOVIE_CHANNELS 数组里加一行即可！）
     ********************************************************************/

        type: 'hls',

      {

        sub: '腾讯云官方直连 · 粤港澳新闻与剧场',
        badge: '实时LIVE',
        type: 'hls',

      },
      {
        id: 'lz_news',
        icon: '📰',
        title: '兰州新闻综合 (HD)',

    /********************************************************************
     * 2. 状态管理与播放器核心逻辑
     ********************************************************************/
    let currentCategory = 'live';
    let currentPlayingId = 'gd_tv';
    let mainHls = null;
    let wallHlsList = [null, null, null, null];
    let isStageWall = false;
    let isSoundOn = false;

    // 读取用户保存在本地的自定义电影与直播源
    function getCustomList(cat) {
      try {
        return JSON.parse(localStorage.getItem('TESLA_CUSTOM_' + cat) || '[]');
      } catch (_) {
        return [];
      }
    }

    function getCategoryItems(cat) {
      const custom = getCustomList(cat);
      if (cat === 'live') return [...custom, ...LIVE_TV_CHANNELS];
      if (cat === 'movies') return [...custom, ...DEFAULT_MOVIE_CHANNELS];
      return [...custom, ...BILI_CHANNELS];
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.getElementById('tabLive').classList.toggle('active', cat === 'live');
      document.getElementById('tabMovies').classList.toggle('active', cat === 'movies');
      document.getElementById('tabBili').classList.toggle('active', cat === 'bili');
      renderMediaList();
    }

    function renderMediaList() {
      const box = document.getElementById('mediaListContainer');
      const items = getCategoryItems(currentCategory);
      box.innerHTML = items.map(item => `
        <div class="media-card ${item.id === currentPlayingId ? 'active' : ''}" onclick="playMediaItem('${item.id}')">
          <div class="media-card-left">
            <div class="media-icon">${item.icon || '🎬'}</div>
            <div class="media-info">
              <div class="media-title">${item.title}</div>
              <div class="media-sub">${item.sub || '点击立即在车机巨幕播放'}</div>
            </div>
          </div>
          <div class="media-badge ${currentCategory === 'movies' ? 'vod' : ''}">${item.badge || '高清'}</div>
        </div>
      `).join('');
    }

    function findMediaById(id) {
      const all = [
        ...getCategoryItems('live'),
        ...getCategoryItems('movies'),
        ...getCategoryItems('bili')
      ];
      return all.find(x => x.id === id);
    }

    function playMediaItem(id) {
      const item = findMediaById(id);
      if (!item) return;
      currentPlayingId = id;

      if (isStageWall) {
        setStageMode('single');
      }

      document.getElementById('nowPlayingTitle').textContent = item.title;
      renderMediaList();

      const video = document.getElementById('mainVideo');
      const iframe = document.getElementById('mainIframe');

      // 处理 B站直播间或 B站 BV 视频号
      if (item.type === 'bili_live' || /^\d+$/.test(item.url)) {
        if (mainHls) mainHls.destroy();
        video.pause();
        video.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = `https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=${item.url}&quality=0`;
        return;
      }

      if (item.type === 'bili_bv' || /^BV[a-zA-Z0-9]+$/i.test(item.url)) {
        if (mainHls) mainHls.destroy();
        video.pause();
        video.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = `https://player.bilibili.com/player.html?bvid=${item.url}&high_quality=1&danmaku=0&autoplay=1`;
        return;
      }

      // 处理原生 MP4 电影直链
      iframe.style.display = 'none';
      iframe.src = '';
      video.style.display = 'block';

      if (item.url.endsWith('.mp4') || item.url.includes('.mp4?')) {
        if (mainHls) mainHls.destroy();
        video.src = item.url;
        video.muted = !isSoundOn;
        video.play().catch(() => {});
        return;
      }

      // 处理 HLS (.m3u8) 实时直播或电影流
      if (window.Hls && Hls.isSupported()) {
        if (mainHls) mainHls.destroy();
        mainHls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          liveSyncDurationCount: 2,
          liveMaxLatencyDurationCount: 5
        });
        mainHls.loadSource(item.url);
        mainHls.attachMedia(video);
        mainHls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = !isSoundOn;
          video.play().then(() => {
            if (currentCategory === 'live' && mainHls.liveSyncPosition) {
              video.currentTime = mainHls.liveSyncPosition;
            }
          }).catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = item.url;
        video.muted = !isSoundOn;
        video.play().catch(() => {});
      }
    }

    /********************************************************************
     * 3. 四宫格电视监控墙模式 (同时监控播放 4 个国内实时频道)
     ********************************************************************/
    const WALL_DEFAULT_URLS = [
      LIVE_TV_CHANNELS[0], // 广东卫视
      LIVE_TV_CHANNELS[1], // 河北卫视 4K
      LIVE_TV_CHANNELS[2], // 广州综合
      LIVE_TV_CHANNELS[3]  // 兰州新闻 HD
    ];

    function setStageMode(mode) {
      isStageWall = (mode === 'wall');
      document.getElementById('btnModeSingle').classList.toggle('active', !isStageWall);
      document.getElementById('btnModeWall').classList.toggle('active', isStageWall);

      const singleEl = document.getElementById('singleStage');
      const wallEl = document.getElementById('gridWallStage');

      if (isStageWall) {
        document.getElementById('mainVideo').pause();
        singleEl.style.display = 'none';
        wallEl.style.display = 'grid';
        document.getElementById('nowPlayingTitle').textContent = '🎛️ 四宫格多路实时电视墙 (点击切换声音，双击放大)';
        initWallStreams();
      } else {
        stopWallStreams();
        wallEl.style.display = 'none';
        singleEl.style.display = 'flex';
        playMediaItem(currentPlayingId);
      }
    }

    function initWallStreams() {
      WALL_DEFAULT_URLS.forEach((ch, idx) => {
        const vid = document.getElementById(`wallVid${idx}`);
        if (!vid) return;
        if (window.Hls && Hls.isSupported()) {
          if (wallHlsList[idx]) wallHlsList[idx].destroy();
          const h = new Hls({ enableWorker: true, liveSyncDurationCount: 2 });
          h.loadSource(ch.url);
          h.attachMedia(vid);
          h.on(Hls.Events.MANIFEST_PARSED, () => {
            vid.muted = (idx !== 0 || !isSoundOn);
            vid.play().catch(() => {});
          });
          wallHlsList[idx] = h;
        } else {
          vid.src = ch.url;
          vid.play().catch(() => {});
        }
      });
    }

    function stopWallStreams() {
      wallHlsList.forEach((h, idx) => {
        if (h) { h.destroy(); wallHlsList[idx] = null; }
        const vid = document.getElementById(`wallVid${idx}`);
        if (vid) vid.pause();
      });
    }

    function focusWallCell(idx) {
      document.querySelectorAll('.wall-cell').forEach((c, i) => {
        c.classList.toggle('focused', i === idx);
        const vid = document.getElementById(`wallVid${i}`);
        if (vid) vid.muted = (i !== idx || !isSoundOn);
      });
      document.getElementById('nowPlayingTitle').textContent = `🎛️ 四宫格焦点：${WALL_DEFAULT_URLS[idx].title}`;
    }

    function expandWallCellToSingle(idx) {
      const target = WALL_DEFAULT_URLS[idx];
      if (target) {
        currentPlayingId = target.id;
        setStageMode('single');
      }
    }

    /********************************************************************
     * 4. 声音解锁、巨幕侧边栏收起、添加新电影保存
     ********************************************************************/
    function toggleMasterSound() {
      isSoundOn = !isSoundOn;
      const vid = document.getElementById('mainVideo');
      vid.muted = !isSoundOn;

      const btn = document.getElementById('btnSound');
      if (isSoundOn) {
        btn.classList.remove('unmute-warn');
        btn.classList.add('active');
        btn.textContent = '🔊 原声已开启';
      } else {
        btn.classList.remove('active');
        btn.classList.add('unmute-warn');
        btn.textContent = '🔇 点此开启声音';
      }
    }

    function togglePureCinema() {
      document.body.classList.toggle('cinema-pure');
      const isPure = document.body.classList.contains('cinema-pure');
      document.getElementById('btnToggleSidebar').textContent = isPure ? '▶ 展开频道/电影列表' : '◀ 收起列表 (巨幕模式)';
    }

    function toggleTicker() {
      document.body.classList.toggle('hide-ticker');
    }

    function openAddModal() {
      document.getElementById('addModal').classList.add('open');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
    }

    function saveCustomMedia(targetCat) {
      const title = document.getElementById('newMediaTitle').value.trim();
      const url = document.getElementById('newMediaUrl').value.trim();
      if (!title || !url) return;

      const newItem = {
        id: 'custom_' + Date.now(),
        icon: targetCat === 'movies' ? '🍿' : '📡',
        title,
        sub: '私人定制片源 · 点击立即播放',
        badge: targetCat === 'movies' ? '私人片单' : '自定LIVE',
        type: /^BV/i.test(url) ? 'bili_bv' : (/^\d+$/.test(url) ? 'bili_live' : 'hls'),
        url
      };

      const list = getCustomList(targetCat);
      list.unshift(newItem);
      localStorage.setItem('TESLA_CUSTOM_' + targetCat, JSON.stringify(list));

      document.getElementById('newMediaTitle').value = '';
      document.getElementById('newMediaUrl').value = '';
      closeAddModal();

      switchCategory(targetCat);
      playMediaItem(newItem.id);
    }

    function launchTeslaTheaterFullscreen() {
      window.location.href = 'https://www.youtube.com/redirect?q=' + encodeURIComponent(window.location.href);
    }

    // 实时时钟与底部滚动资讯
    const NEWS_ITEMS = [
      '💡 行车提示：挂 D 档开车时请勿点击右上角「P档真全屏」，直接在当前窗口点击左上角「◀ 收起列表」即可实现 D 档 100% 满屏观看！',
      '🎬 如何加电影：点击左下角「➕ 添加想看的电影」，粘贴任意 .mp4 / .m3u8 链接或 B站 BV 号即可存入您的私人影院。',
      '🎛️ 试试右上角的「四宫格电视墙」：可以在特斯拉 15.4 寸大屏上同时监控播放广东卫视、河北卫视 4K、广州综合与兰州新闻 4 路实时电视！'
    ];
    let tickerIdx = 0;

    function nextTicker() {
      tickerIdx = (tickerIdx + 1) % NEWS_ITEMS.length;
      document.getElementById('tickerText').textContent = NEWS_ITEMS[tickerIdx];
    }

    setInterval(nextTicker, 8000);

    function updateClock() {
      const now = new Date();
      document.getElementById('clockText').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 初始化启动首台实时直播
    window.addEventListener('DOMContentLoaded', () => {
      renderMediaList();
      playMediaItem('gd_tv');
    });
