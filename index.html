<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tesla Live TV Wall & 私人影院 (D档行车常亮版)</title>
  <!-- HLS.js 流媒体硬件解码引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg-main: #070a10;
      --bg-panel: rgba(15, 20, 30, 0.92);
      --bg-card: rgba(26, 34, 50, 0.72);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* 整体座舱布局：左侧可收起片单/频道抽屉 + 右侧满屏播放区 */
    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 左侧边栏：频道墙与私人电影库 */
    .sidebar {
      width: 350px;
      height: 100%;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: margin-left 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    body.cinema-pure .sidebar {
      margin-left: -350px;
    }

    .brand-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 12px var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0.9; }
    }

    .clock-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* 顶部一级分类切换 Tab */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-glass);
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-color: #67e8f9;
      color: #fff;
      box-shadow: 0 6px 18px rgba(6, 182, 212, 0.32);
    }

    /* 频道与电影滚动列表区 */
    .media-list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .media-list-wrap::-webkit-scrollbar { width: 4px; }
    .media-list-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    .media-card {
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 13px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.18s;
    }

    .media-card:hover {
      background: rgba(37, 99, 235, 0.22);
      border-color: rgba(96, 165, 250, 0.4);
    }

    .media-card.active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.38), rgba(6, 182, 212, 0.22));
      border-color: #38bdf8;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.22);
    }

    .media-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .media-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .media-info {
      overflow: hidden;
    }

    .media-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      white-space: nowrap;
    }

    .media-badge.vod {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.4);
    }

    /* 侧边栏底部：自定义添加电影/直播源入口 */
    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(10, 14, 22, 0.9);
    }

    .btn-add-movie {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(56, 189, 248, 0.55);
      background: rgba(6, 182, 212, 0.12);
      color: #38bdf8;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add-movie:active { transform: scale(0.98); }

    /* 右侧主舞台：单屏巨幕 + 四宫格直播墙 + 顶部/底部悬浮控制栏 */
    .stage-main {
      flex: 1;
      height: 100%;
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部悬浮控制条 */
    .stage-topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .pill-btn {
      height: 46px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .pill-btn:active { transform: scale(0.95); }

    .pill-btn.active {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-color: #67e8f9;
    }

    .pill-btn.unmute-warn {
      background: linear-gradient(135deg, #dc2626, #ea580c);
      border-color: #fca5a5;
      animation: pulse 1.8s infinite;
    }

    .now-playing-pill {
      padding: 0 18px;
      height: 46px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    /* 单屏巨幕播放器容器 */
    #singleStage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #mainVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* D档防黑屏模式：保持原生 <video> 100% 全尺寸（防止 Chromium 5秒后判定为极小隐藏元素而自动挂起声音与拉流），
       同时将 <canvas> 悬浮覆盖在视频画面上方（留出底部 48px 原生音量/进度控制条）由 Canvas 100% 渲染画面！ */
    body.dgear-canvas-mode #mainVideo {
      width: 100%;
      height: 100%;
      opacity: 1;
      z-index: 1;
    }

    #dGearCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 48px);
      object-fit: contain;
      background: #000;
      display: none;
      pointer-events: none;
      z-index: 5;
    }

    body.dgear-canvas-mode #dGearCanvas {
      display: block;
    }

    #mainIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
    }

    /* 四宫格直播电视墙容器 (2x2 Grid) */
    #gridWallStage {
      width: 100%;
      height: 100%;
      display: none;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      background: #05080f;
    }

    .wall-cell {
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .wall-cell.focused {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .wall-cell video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .wall-cell-label {
      position: absolute;
      bottom: 10px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wall-cell-expand {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(37, 99, 235, 0.88);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 底部实时滚动快讯条 */
    .bottom-ticker {
      position: absolute;
      bottom: 14px;
      left: 16px;
      right: 16px;
      z-index: 60;
      height: 44px;
      background: rgba(12, 17, 28, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    body.hide-ticker .bottom-ticker {
      display: none;
    }

    /* 添加电影 / 自定义源弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      width: 520px;
      max-width: 100%;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .form-field input {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-field input:focus { border-color: #38bdf8; }

    .btn-submit {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body class="dgear-canvas-mode">

  <div class="app-shell">
    <!-- 左侧抽屉：频道列表 & 私人电影院片单 -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-title">
          <div class="live-dot"></div>
          <span>TESLA 直播墙 & 影院</span>
        </div>
        <div class="clock-badge" id="clockText">22:35</div>
      </div>

      <!-- 3大板块切换 -->
      <div class="nav-tabs">
        <button class="tab-btn active" id="tabLive" onclick="switchCategory('live')">
          📺 电视直播
        </button>
        <button class="tab-btn" id="tabMovies" onclick="switchCategory('movies')">
          🎬 私人影院
        </button>
        <button class="tab-btn" id="tabBili" onclick="switchCategory('bili')">
          🅱️ B站/综合
        </button>
      </div>

      <!-- 频道/片单列表容器 -->
      <div class="media-list-wrap" id="mediaListContainer"></div>

      <!-- 底部：随时添加新电影或自定义直播源 -->
      <div class="sidebar-footer">
        <button class="btn-add-movie" onclick="openAddModal()">
          ➕ 添加想看的电影 / 直播源
        </button>
        <div style="font-size:11.5px;color:var(--text-sub);text-align:center;">
          💡 挂 D 档开车时请保持在浏览器内观看，画面常亮不退出
        </div>
      </div>
    </aside>

    <!-- 右侧主播放舞台 -->
    <main class="stage-main">
      <!-- 顶部悬浮控制栏 -->
      <div class="stage-topbar">
        <div class="topbar-group">
          <button class="pill-btn" onclick="togglePureCinema()" id="btnToggleSidebar">
            ◀ 收起列表 (巨幕模式)
          </button>
          <div class="now-playing-pill">
            <span class="live-dot"></span>
            <span id="nowPlayingTitle">广东卫视 (高清实时真直播)</span>
          </div>
        </div>

        <div class="topbar-group">
          <button class="pill-btn unmute-warn" id="btnSound" onclick="toggleMasterSound()">
            🔇 点此开启声音
          </button>
          <button class="pill-btn active" id="btnDGearMode" onclick="toggleDGearCanvasMode()" title="绕过特斯拉D档对video标签的画面锁，使用CPU软解+Canvas画布渲染">
            🛡️ D档防黑屏: 已开启
          </button>
          <button class="pill-btn active" id="btnModeSingle" onclick="setStageMode('single')">
            🖥️ 单屏巨幕
          </button>
          <button class="pill-btn" id="btnModeWall" onclick="setStageMode('wall')">
            🎛️ 四宫格电视墙
          </button>
          <button class="pill-btn" onclick="toggleTicker()">
            📰 快讯条
          </button>
          <button class="pill-btn" onclick="launchTeslaTheaterFullscreen()" title="仅限P档驻车时使用">
            🚀 P档真全屏
          </button>
        </div>
      </div>

      <!-- 模式 1：单屏高清巨幕播放器 -->
      <div id="singleStage">
        <video id="mainVideo" playsinline autoplay muted controls></video>
        <canvas id="dGearCanvas" width="1280" height="720"></canvas>
        <iframe id="mainIframe" allow="autoplay; fullscreen"></iframe>
      </div>

      <!-- 模式 2：四宫格实时电视监控墙 (同时看 4 个国内台) -->
      <div id="gridWallStage">
        <div class="wall-cell focused" onclick="focusWallCell(0)" ondblclick="expandWallCellToSingle(0)">
          <video id="wallVid0" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 1. CCTV-1 综合 (实时)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(0)">🔍 全屏看此台</button>
        </div>
        <div class="wall-cell" onclick="focusWallCell(1)" ondblclick="expandWallCellToSingle(1)">
          <video id="wallVid1" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 2. 湖南卫视 (高清实时)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(1)">🔍 全屏看此台</button>
        </div>
        <div class="wall-cell" onclick="focusWallCell(2)" ondblclick="expandWallCellToSingle(2)">
          <video id="wallVid2" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 3. 浙江卫视 (1080P实时)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(2)">🔍 全屏看此台</button>
        </div>
        <div class="wall-cell" onclick="focusWallCell(3)" ondblclick="expandWallCellToSingle(3)">
          <video id="wallVid3" playsinline autoplay muted></video>
          <div class="wall-cell-label"><span class="live-dot"></span> 4. 广东卫视 (高清实时)</div>
          <button class="wall-cell-expand" onclick="event.stopPropagation();expandWallCellToSingle(3)">🔍 全屏看此台</button>
        </div>
      </div>

      <!-- 底部电视台同款实时新闻滚动条 -->
      <div class="bottom-ticker">
        <div style="display:flex;align-items:center;gap:10px;overflow:hidden;">
          <span style="background:#ef4444;color:#fff;font-size:11px;font-weight:900;padding:3px 8px;border-radius:6px;white-space:nowrap;">实时快讯</span>
          <span id="tickerText" style="font-size:13.5px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            欢迎使用特斯拉车载直播墙与私人影院 · 挂入 D 档行驶时画面保持常亮不退出 · 点击左上角「收起列表」可享 100% 纯享巨幕。
          </span>
        </div>
        <span style="font-size:12px;color:#38bdf8;white-space:nowrap;cursor:pointer;font-weight:700;" onclick="nextTicker()">下一条 ▸</span>
      </div>
    </main>
  </div>

  <!-- 弹窗：添加想看的电影 / 剧集 / 直播源 -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:19px;font-weight:900;">➕ 添加电影 / 剧集 / 直播源</span>
        <button class="pill-btn" style="height:34px;padding:0 12px;" onclick="closeAddModal()">✕</button>
      </div>
      <div style="font-size:13px;color:var(--text-sub);line-height:1.5;">
        支持添加任意 <code>.mp4</code> 电影直链、<code>.m3u8</code> 影视切片源、或 B站 <code>BV号 / 直播间房号</code>，添加后自动保存在您的私人影院片单中：
      </div>
      <div class="form-field">
        <label>🎬 影片 / 频道名称</label>
        <input type="text" id="newMediaTitle" placeholder="例如：《星际穿越》4K / 狂飙 第1集 / 凤凰卫视" />
      </div>
      <div class="form-field">
        <label>🔗 视频流地址 (.mp4 / .m3u8 / B站BV号 / 直播房号)</label>
        <input type="text" id="newMediaUrl" placeholder="粘贴 https://...mp4 或 .m3u8 链接，或输入 BV1xx411c7mD" />
      </div>
      <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="btn-submit" style="flex:1;" onclick="saveCustomMedia('movies')">💾 存入【私人影院】并立即播放</button>
        <button class="btn-submit" style="background:rgba(255,255,255,0.12);font-size:13px;" onclick="saveCustomMedia('live')">存入【直播】</button>
      </div>
    </div>
  </div>

  <script>
    /********************************************************************
     * 1. 内置节目单配置区（后期想加任何电影，直接往 MOVIE_CHANNELS 数组里加一行即可！）
     ********************************************************************/
    const LIVE_TV_CHANNELS = [
      {

    /********************************************************************
     * 2.1 特斯拉 D 档防黑屏核心引擎 (hls.js fMP4 BUFFER_APPENDING + WebCodecs + Canvas 2D 直绘)
     * 原理：特斯拉车机挂入 D 档后，Chromium 底层会屏蔽 <video> 硬件视频层画面（仅保留声音），
     *       但不会屏蔽 HTML5 <canvas> 画布！我们直接复用 hls.js WebWorker 解复用输出的 fMP4 (avcC + moof + mdat)
     *       精确视频帧，送入 WebCodecs VideoDecoder 解码并实时画在 <canvas> 上，0 误差、不断流！
     ********************************************************************/
    const dGearCanvas = document.getElementById('dGearCanvas');
    const dGearCtx = dGearCanvas ? dGearCanvas.getContext('2d', { alpha: false }) : null;
    let dGearDecoder = null;
    let dGearDecoderCodec = '';
    let dGearWaitingKey = true;
    let dGearAuQueue = [];
    let dGearAvcC = null;
    let dGearLastCodec = 'avc1.640020';
    let dGearFrameTimestamp = 0;
    let dGearLastWebCodecsRenderMs = 0;

    function resetDGearDecoder() {
      dGearAuQueue = [];
      dGearWaitingKey = true;
      dGearAvcC = null;
      if (dGearDecoder) {
        try { dGearDecoder.close(); } catch (_) {}
        dGearDecoder = null;
      }
      dGearDecoderCodec = '';
    }

    function toggleDGearCanvasMode() {
      isDGearCanvasMode = !isDGearCanvasMode;
      document.body.classList.toggle('dgear-canvas-mode', isDGearCanvasMode);
      const btn = document.getElementById('btnDGearMode');
      if (btn) {
        btn.classList.toggle('active', isDGearCanvasMode);
        btn.textContent = isDGearCanvasMode ? '🛡️ D档防黑屏: 已开启' : '🛡️ D档防黑屏: 已关闭';
      }
      if (!isDGearCanvasMode) {
        resetDGearDecoder();
      }
    }

    let dGearAccelPreference = 'no-preference';
    let dGearHasDecodedOnce = false;

    function ensureDGearDecoder(codecStr, avcCBytes) {
      if (!('VideoDecoder' in window)) return false;
      if (!avcCBytes) return false;
      const sig = codecStr + '_' + avcCBytes.byteLength + '_' + avcCBytes[1] + '_' + avcCBytes[3];
      if (dGearDecoder && dGearDecoder.state === 'configured' && dGearDecoderCodec === sig) {
        return true;
      }
      if (dGearDecoder) {
        try { dGearDecoder.close(); } catch (_) {}
        dGearDecoder = null;
      }
      dGearDecoder = new VideoDecoder({
        output(frame) {
          dGearHasDecodedOnce = true;
          if (isDGearCanvasMode && dGearCanvas && dGearCtx) {
            if (frame.displayWidth && frame.displayHeight) {
              if (dGearCanvas.width !== frame.displayWidth || dGearCanvas.height !== frame.displayHeight) {
                dGearCanvas.width = frame.displayWidth;
                dGearCanvas.height = frame.displayHeight;
              }
            }
            try {
              dGearCtx.drawImage(frame, 0, 0, dGearCanvas.width, dGearCanvas.height);
              dGearLastWebCodecsRenderMs = Date.now();
            } catch (_) {}
          }
          frame.close();
        },
        error(err) {
          console.warn('DGear VideoDecoder transient error, waiting next keyframe:', err);
          if (!dGearHasDecodedOnce) {
            dGearAccelPreference = (dGearAccelPreference === 'no-preference') ? 'prefer-software' : 'no-preference';
          }
          dGearDecoderCodec = '';
          dGearWaitingKey = true;
        }
      });

      try {
        dGearDecoder.configure({
          codec: codecStr || 'avc1.640020',
          description: avcCBytes,
          optimizeForLatency: true,
          hardwareAcceleration: dGearAccelPreference
        });
        dGearDecoderCodec = sig;
        dGearWaitingKey = true;
        return true;
      } catch (_) {
        try {
          dGearDecoder.configure({
            codec: codecStr || 'avc1.640020',
            description: avcCBytes,
            optimizeForLatency: true
          });
          dGearDecoderCodec = sig;
          dGearWaitingKey = true;
          return true;
        } catch (__) {
          return false;
        }
      }
    }

    // 直接解析 hls.js BUFFER_APPENDING 产出的标准 fMP4 (ftyp/moov + moof/mdat)
    function feedFmp4ToDGearEngine(rawData) {
      if (!isDGearCanvasMode || !rawData) return;
      const u = rawData instanceof Uint8Array
        ? rawData
        : new Uint8Array(rawData.buffer || rawData, rawData.byteOffset || 0, rawData.byteLength || rawData.length);
      const len = u.byteLength;
      if (len < 16) return;

      const dv = new DataView(u.buffer, u.byteOffset, u.byteLength);
      let offset = 0;
      let pendingSampleSizes = [];
      let pendingSampleIsKey = [];

      while (offset + 8 <= len) {
        const boxSz = dv.getUint32(offset);
        if (boxSz < 8 || offset + boxSz > len) break;
        const b0 = u[offset + 4], b1 = u[offset + 5], b2 = u[offset + 6], b3 = u[offset + 7];

        // 1. 'moov' (0x6D6F6F76): 提取 avcC 解码配置记录
        if (b0 === 0x6D && b1 === 0x6F && b2 === 0x6F && b3 === 0x76) {
          for (let i = offset + 8; i < offset + boxSz - 8; i++) {
            if (u[i + 4] === 0x61 && u[i + 5] === 0x76 && u[i + 6] === 0x63 && u[i + 7] === 0x43) { // 'avcC'
              const avcCSz = dv.getUint32(i);
              if (avcCSz > 11 && i + avcCSz <= offset + boxSz) {
                dGearAvcC = new Uint8Array(u.subarray(i + 8, i + avcCSz));
                const p = dGearAvcC[1].toString(16).padStart(2, '0');
                const c = dGearAvcC[2].toString(16).padStart(2, '0');
                const l = dGearAvcC[3].toString(16).padStart(2, '0');
                dGearLastCodec = `avc1.${p}${c}${l}`;
                break;
              }
            }
          }
        }
        // 2. 'moof' (0x6D6F6F66): 提取 trun 中每一帧的精确字节长度与关键帧标记
        else if (b0 === 0x6D && b1 === 0x6F && b2 === 0x6F && b3 === 0x66) {
          pendingSampleSizes = [];
          pendingSampleIsKey = [];
          for (let i = offset + 8; i < offset + boxSz - 16; i++) {
            if (u[i + 4] === 0x74 && u[i + 5] === 0x72 && u[i + 6] === 0x75 && u[i + 7] === 0x6E) { // 'trun'
              const trunSz = dv.getUint32(i);
              if (trunSz < 16 || i + trunSz > offset + boxSz) continue;
              const flags = (u[i + 9] << 16) | (u[i + 10] << 8) | u[i + 11];
              const sampleCount = dv.getUint32(i + 12);
              let pos = i + 16;
              if (flags & 0x001) pos += 4; // data_offset
              let firstFlags = 0;
              if (flags & 0x004) {
                firstFlags = dv.getUint32(pos);
                pos += 4;
              }
              for (let s = 0; s < sampleCount && pos <= i + trunSz; s++) {
                if (flags & 0x100) pos += 4; // sample_duration
                let sz = 0;
                if (flags & 0x200) {
                  sz = dv.getUint32(pos);
                  pos += 4;
                }
                let sflags = (s === 0 && (flags & 0x004)) ? firstFlags : 0;
                if (flags & 0x400) {
                  sflags = dv.getUint32(pos);
                  pos += 4;
                }
                if (flags & 0x800) pos += 4; // sample_composition_time_offset
                const isKey = ((flags & 0x400) || (s === 0 && (flags & 0x004)))
                  ? ((sflags & 0x00010000) === 0)
                  : (s === 0);
                if (sz > 0) {
                  pendingSampleSizes.push(sz);
                  pendingSampleIsKey.push(isKey);
                }
              }
              break;
            }
          }
        }
        // 3. 'mdat' (0x6D646174): 按 trun 记录的帧大小逐帧切分并推入队列
        else if (b0 === 0x6D && b1 === 0x64 && b2 === 0x61 && b3 === 0x74) {
          if (pendingSampleSizes.length > 0 && dGearAvcC) {
            let curPos = offset + 8;
            const mdatEnd = offset + boxSz;
            for (let k = 0; k < pendingSampleSizes.length; k++) {
              const sz = pendingSampleSizes[k];
              if (curPos + sz > mdatEnd) break;
              const frameBytes = new Uint8Array(u.subarray(curPos, curPos + sz));
              curPos += sz;

              if (dGearAuQueue.length > 500) {
                const nextKeyIdx = dGearAuQueue.findIndex((x, idx) => idx > 80 && x.isKey);
                if (nextKeyIdx !== -1) {
                  dGearAuQueue.splice(0, nextKeyIdx);
                  dGearWaitingKey = true;
                } else {
                  dGearAuQueue.shift();
                }
              }

              dGearAuQueue.push({
                isKey: pendingSampleIsKey[k],
                data: frameBytes,
                codec: dGearLastCodec,
                avcC: dGearAvcC
              });
            }
            pendingSampleSizes = [];
            pendingSampleIsKey = [];
          }
        }

        offset += boxSz;
      }
    }

    // 25fps (40ms) 广电标准帧率节拍器：与国内电视直播 25fps 严格同步，绝不抽干缓冲队列！
    setInterval(() => {
      if (!isDGearCanvasMode || isStageWall) return;

      if (dGearAuQueue.length > 0 && ('VideoDecoder' in window)) {
        const decodeCount = dGearAuQueue.length > 350 ? 2 : 1;
        for (let step = 0; step < decodeCount; step++) {
          if (dGearAuQueue.length === 0) break;

          const peek = dGearAuQueue[0];
          const ok = ensureDGearDecoder(peek.codec, peek.avcC);
          if (!ok || !dGearDecoder || dGearDecoder.state !== 'configured') break;

          if (dGearWaitingKey) {
            while (dGearAuQueue.length > 0 && !dGearAuQueue[0].isKey) {
              dGearAuQueue.shift();
            }
            if (dGearAuQueue.length === 0) break;
            dGearWaitingKey = false;
          }

          const item = dGearAuQueue.shift();
          if (!item) break;

          try {
            const chunk = new EncodedVideoChunk({
              type: item.isKey ? 'key' : 'delta',
              timestamp: dGearFrameTimestamp,
              data: item.data
            });
            dGearFrameTimestamp += 40000;
            dGearDecoder.decode(chunk);
          } catch (e) {
            dGearWaitingKey = true;
            break;
          }
        }
        return;
      }

      // 兜底渲染通道：当播放 MP4 直链或首个切片尚未解出时，若 <video> 帧可读则直接转绘到 Canvas
      const video = document.getElementById('mainVideo');

          if (dGearCanvas.width !== vw || dGearCanvas.height !== vh) {

            dGearCanvas.height = vh;
          }
          try {
            dGearCtx.drawImage(video, 0, 0, vw, vh);
          } catch (_) {}
        }
      }
    }, 40);

        if (dGearCanvas) dGearCanvas.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = `https://player.bilibili.com/player.html?bvid=${item.url}&high_quality=1&danmaku=0&autoplay=1`;
        return;
      }

      // 处理原生 MP4 电影直链
      iframe.style.display = 'none';
      iframe.src = '';
      video.style.display = 'block';
      if (dGearCanvas) dGearCanvas.style.display = '';

      if (item.url.endsWith('.mp4') || item.url.includes('.mp4?')) {
        if (mainHls) mainHls.destroy();
        video.src = item.url;
        video.muted = !isSoundOn;
        video.play().catch(() => {});
        return;
      }

      // 处理 HLS (.m3u8) 实时直播或电影流
      if (window.Hls && Hls.isSupported()) {
        if (mainHls) mainHls.destroy();
        mainHls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          liveSyncDurationCount: 3,
          liveMaxLatencyDurationCount: 10,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 6,
          levelLoadingTimeOut: 15000,
          levelLoadingMaxRetry: 6,
          fragLoadingTimeOut: 20000,
          fragLoadingMaxRetry: 6
        });

        // 核心：直接订阅 hls.js WebWorker 解复用后的标准 fMP4 视频缓冲块 (avcC + moof + mdat)！
        mainHls.on(Hls.Events.BUFFER_APPENDING, (event, data) => {
          if (isDGearCanvasMode && data && data.type === 'video' && data.data) {
            feedFmp4ToDGearEngine(data.data);
          }
        });

        // 自动错误恢复与防断流自愈机制
        mainHls.on(Hls.Events.ERROR, (event, data) => {
          if (data && data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              mainHls.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              mainHls.recoverMediaError();
            } else {
              playMediaItem(currentPlayingId);
            }
          }
        });

        mainHls.loadSource(item.url);
        mainHls.attachMedia(video);

        mainHls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.muted = !isSoundOn;
          video.play().catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = item.url;
        video.muted = !isSoundOn;
        video.play().catch(() => {});
      }
    }

    /********************************************************************
     * 3. 四宫格电视监控墙模式 (同时监控播放 4 个国内实时频道)
     ********************************************************************/
    const WALL_DEFAULT_URLS = [
      LIVE_TV_CHANNELS[0], // CCTV-1 综合
      LIVE_TV_CHANNELS[4], // 湖南卫视
      LIVE_TV_CHANNELS[3], // 浙江卫视 1080P
      LIVE_TV_CHANNELS[5]  // 广东卫视
    ];

    function setStageMode(mode) {
      isStageWall = (mode === 'wall');
      document.getElementById('btnModeSingle').classList.toggle('active', !isStageWall);
      document.getElementById('btnModeWall').classList.toggle('active', isStageWall);

      const singleEl = document.getElementById('singleStage');
      const wallEl = document.getElementById('gridWallStage');

      if (isStageWall) {
        document.getElementById('mainVideo').pause();
        singleEl.style.display = 'none';
        wallEl.style.display = 'grid';
        document.getElementById('nowPlayingTitle').textContent = '🎛️ 四宫格多路实时电视墙 (点击切换声音，双击放大)';
        initWallStreams();
      } else {
        stopWallStreams();
        wallEl.style.display = 'none';
        singleEl.style.display = 'flex';
        playMediaItem(currentPlayingId);
      }
    }

    function initWallStreams() {
      WALL_DEFAULT_URLS.forEach((ch, idx) => {
        const vid = document.getElementById(`wallVid${idx}`);
        if (!vid) return;
        if (window.Hls && Hls.isSupported()) {
          if (wallHlsList[idx]) wallHlsList[idx].destroy();
          const h = new Hls({ enableWorker: true, liveSyncDurationCount: 2 });
          h.loadSource(ch.url);
          h.attachMedia(vid);
          h.on(Hls.Events.MANIFEST_PARSED, () => {
            vid.muted = (idx !== 0 || !isSoundOn);
            vid.play().catch(() => {});
          });
          wallHlsList[idx] = h;
        } else {
          vid.src = ch.url;
          vid.play().catch(() => {});
        }
      });
    }

    function stopWallStreams() {
      wallHlsList.forEach((h, idx) => {
        if (h) { h.destroy(); wallHlsList[idx] = null; }
        const vid = document.getElementById(`wallVid${idx}`);
        if (vid) vid.pause();
      });
    }

    function focusWallCell(idx) {
      document.querySelectorAll('.wall-cell').forEach((c, i) => {
        c.classList.toggle('focused', i === idx);
        const vid = document.getElementById(`wallVid${i}`);
        if (vid) vid.muted = (i !== idx || !isSoundOn);
      });
      document.getElementById('nowPlayingTitle').textContent = `🎛️ 四宫格焦点：${WALL_DEFAULT_URLS[idx].title}`;
    }

    function expandWallCellToSingle(idx) {
      const target = WALL_DEFAULT_URLS[idx];
      if (target) {
        currentPlayingId = target.id;
        setStageMode('single');
      }
    }

    /********************************************************************
     * 4. 声音解锁、巨幕侧边栏收起、添加新电影保存
     ********************************************************************/
    function toggleMasterSound() {
      isSoundOn = !isSoundOn;
      const vid = document.getElementById('mainVideo');
      vid.muted = !isSoundOn;

      const btn = document.getElementById('btnSound');
      if (isSoundOn) {
        btn.classList.remove('unmute-warn');
        btn.classList.add('active');
        btn.textContent = '🔊 原声已开启';
      } else {
        btn.classList.remove('active');
        btn.classList.add('unmute-warn');
        btn.textContent = '🔇 点此开启声音';
      }
    }

    function togglePureCinema() {
      document.body.classList.toggle('cinema-pure');
      const isPure = document.body.classList.contains('cinema-pure');
      document.getElementById('btnToggleSidebar').textContent = isPure ? '▶ 展开频道/电影列表' : '◀ 收起列表 (巨幕模式)';
    }

    function toggleTicker() {
      document.body.classList.toggle('hide-ticker');
    }

    function openAddModal() {
      document.getElementById('addModal').classList.add('open');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
    }

    function saveCustomMedia(targetCat) {
      const title = document.getElementById('newMediaTitle').value.trim();
      const url = document.getElementById('newMediaUrl').value.trim();
      if (!title || !url) return;

      const newItem = {
        id: 'custom_' + Date.now(),
        icon: targetCat === 'movies' ? '🍿' : '📡',
        title,
        sub: '私人定制片源 · 点击立即播放',
        badge: targetCat === 'movies' ? '私人片单' : '自定LIVE',
        type: /^BV/i.test(url) ? 'bili_bv' : (/^\d+$/.test(url) ? 'bili_live' : 'hls'),
        url
      };

      const list = getCustomList(targetCat);
      list.unshift(newItem);
      localStorage.setItem('TESLA_CUSTOM_' + targetCat, JSON.stringify(list));

      document.getElementById('newMediaTitle').value = '';
      document.getElementById('newMediaUrl').value = '';
      closeAddModal();

      switchCategory(targetCat);
      playMediaItem(newItem.id);
    }

    function launchTeslaTheaterFullscreen() {
      window.location.href = 'https://www.youtube.com/redirect?q=' + encodeURIComponent(window.location.href);
    }

    // 实时时钟与底部滚动资讯
    const NEWS_ITEMS = [
      '🛡️ D档防黑屏引擎已默认开启：已绕过特斯拉 D 档对 <video> 的画面屏蔽，采用 <canvas> 实时软解直绘，挂 D 档开车画面常亮有声音！',
      '📺 已新增：CCTV-1 综合、CCTV-6 电影、CCTV-13 新闻、浙江卫视 (1080P)、湖南卫视，并已清理兰州与哈尔滨频道。',
      '🎛️ 试试右上角的「四宫格电视墙」：可以在特斯拉 15.4 寸大屏上同时监控播放 CCTV-1、湖南卫视、浙江卫视 1080P 与广东卫视 4 路实时电视！'
    ];
    let tickerIdx = 0;

    function nextTicker() {
      tickerIdx = (tickerIdx + 1) % NEWS_ITEMS.length;
      document.getElementById('tickerText').textContent = NEWS_ITEMS[tickerIdx];
    }

    setInterval(nextTicker, 8000);

    function updateClock() {
      const now = new Date();
      document.getElementById('clockText').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 锁车熄屏自动断流休眠保护：当特斯拉锁车关屏 (document.hidden) 时自动暂停拉流，防止阻止车辆休眠掉电；亮屏时自动恢复！
    document.addEventListener('visibilitychange', () => {
      const video = document.getElementById('mainVideo');
      if (document.hidden) {
        if (video) video.pause();
        if (mainHls) mainHls.stopLoad();
        stopWallStreams();
        resetDGearDecoder();
      } else {
        if (isStageWall) {
          initWallStreams();
        } else {
          if (mainHls) mainHls.startLoad();
          if (video) video.play().catch(() => {});
        }
      }
    });

    // 3秒常驻防卡死看门狗：一旦检测到缓冲空洞或浏览器自动暂停，立即自愈跳过空洞继续播放！
    let lastWatchdogTime = -1;
    let stallCounter = 0;
    setInterval(() => {
      if (document.hidden || isStageWall) return;
      const video = document.getElementById('mainVideo');
      if (!video || video.style.display === 'none') return;
      if (video.paused) {
        video.play().catch(() => {});
      }
      if (mainHls) {
        if (Math.abs(video.currentTime - lastWatchdogTime) < 0.05) {
          stallCounter++;
          if (stallCounter >= 3) {
            mainHls.startLoad();
            if (video.buffered && video.buffered.length > 0) {
              const end = video.buffered.end(video.buffered.length - 1);
              if (end - video.currentTime > 1.5) {
                video.currentTime = Math.max(0, end - 3);
              }
            }
            video.play().catch(() => {});
            stallCounter = 0;
          }
        } else {
          stallCounter = 0;
          lastWatchdogTime = video.currentTime;
        }
      }
    }, 3000);

    // 初始化启动首台实时直播
    window.addEventListener('DOMContentLoaded', () => {
      renderMediaList();
      playMediaItem('cctv1');
    });
  </script>
</body>
